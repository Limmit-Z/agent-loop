<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 轨迹回放</title>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#26334a;background:#f5f7fa}button,select{font:inherit;padding:.5rem;margin:.3rem}article{background:white;border:1px solid #dce4ee;border-radius:8px;padding:1rem;margin-top:1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:24rem;overflow:auto}svg{width:100%;height:150px;background:white;border:1px solid #dce4ee}.muted{color:#536783}</style></head><body>
<h1>Agent 轨迹回放</h1><label>问题 <select id="runs"></select></label><button id="prev">上一步</button><button id="next">下一步</button><span id="position" role="status"></span>
<p id="question"></p><h2>上下文预算占用</h2><svg id="chart" viewBox="0 0 600 150" preserveAspectRatio="none" role="img" aria-label="每一步的上下文占用曲线"><line x1="30" y1="30" x2="580" y2="30" stroke="#e4a55c" stroke-dasharray="4"/><polyline id="line" fill="none" stroke="#356ac3" stroke-width="3"/><circle id="point" r="5" fill="#e04a3a"/></svg><p class="muted">虚线表示 100% 软预算；图线按所选问题的各步占用绘制。</p>
<article><h2 id="heading"></h2><p><b>思考：</b><span id="thought"></span></p><p><b>工具：</b><span id="tool"></span></p><p><b>参数：</b><span id="args"></span></p><p><b>上下文与动作：</b><span id="context"></span></p><p><b>终止原因：</b><span id="termination"></span></p><h3>观察结果</h3><pre id="observation"></pre></article>
<script>
const trace=/*TRACE_DATA*/;const $=id=>document.getElementById(id);const ids=[...new Set(trace.map(x=>x.run_id))];let selected=ids[0], index=0;
for(const id of ids){let option=document.createElement('option');option.value=id;option.textContent=id;$('runs').append(option)}
function draw(){const rows=trace.filter(x=>x.run_id===selected),r=rows[index];if(!r)return;$('question').textContent=r.question;$('position').textContent=`第 ${index+1} / ${rows.length} 步`;$('heading').textContent=`步骤 ${r.step}`;$('thought').textContent=r.thought;$('tool').textContent=r.tool||'无';$('args').textContent=JSON.stringify(r.args);$('context').textContent=`${(r.context_ratio*100).toFixed(1)}% → ${(r.ratio_after*100).toFixed(1)}%，${r.action_taken}`;$('termination').textContent=r.termination_reason||'进行中';$('observation').textContent=JSON.stringify(r.observation,null,2);$('prev').disabled=index===0;$('next').disabled=index===rows.length-1;
const max=Math.max(1.2,...rows.map(x=>x.context_ratio)),xx=i=>30+(rows.length===1?0:i*550/(rows.length-1)),yy=v=>140-v/max*130;$('line').setAttribute('points',rows.map((x,i)=>`${xx(i)},${yy(x.context_ratio)}`).join(' '));$('point').setAttribute('cx',xx(index));$('point').setAttribute('cy',yy(r.context_ratio));document.querySelector('line').setAttribute('y1',yy(1));document.querySelector('line').setAttribute('y2',yy(1))}
$('runs').addEventListener('change',e=>{selected=e.target.value;index=0;draw()});$('prev').addEventListener('click',()=>{if(index>0){index--;draw()}});$('next').addEventListener('click',()=>{if(index<trace.filter(x=>x.run_id===selected).length-1){index++;draw()}});draw();
</script></body></html>
